# Production broker: TLS on 8883, one username/password per node, ACL per topic.
listener 8883
certfile /mosquitto/certs/fullchain.pem
keyfile /mosquitto/certs/privkey.pem
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl
persistence true
persistence_location /mosquitto/data/
log_dest stdout

# Example ACL (/mosquitto/config/acl):
#   user node-hh001-a
#   topic write kubaho/node-hh001-a/#
#   user kubaho-worker
#   topic read kubaho/#
