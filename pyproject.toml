[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kubaho"
version = "0.1.0"
description = "Camera-free WiFi-CSI fall and wellness monitoring for rural Rwandan homes"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
